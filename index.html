<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1st Quarter Project | SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(164, 196, 144, 0.35), transparent 35%),
                linear-gradient(135deg, #f7f3e8, #e8f0df);
            min-height: 100vh;
            color: #29412b;
        }

        .navbar {
            background: #294d35;
            padding: 16px 0;
            box-shadow: 0 5px 15px rgba(40, 70, 45, 0.15);
        }

        .navbar-brand {
            color: #fff8e7 !important;
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
        }

        .navbar-brand:hover {
            color: #dcebcf !important;
        }

        .app-card {
            background: #fffdf6;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(50, 75, 45, 0.15);
            border: 3px solid #d8e5ca;
            position: relative;
            transform: rotate(-0.5deg);
        }

        .app-card::before {
            content: "✦";
            position: absolute;
            top: 18px;
            right: 25px;
            font-size: 25px;
            color: #8aab72;
        }

        .app-card::after {
            content: "♡";
            position: absolute;
            bottom: 18px;
            left: 25px;
            font-size: 25px;
            color: #9bb887;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #dcebcf;
            color: #416b47;
            font-size: 30px;
            margin-bottom: 12px;
            box-shadow: 0 5px 0 #b9cda8;
        }

        h1 {
            color: #294d35;
            font-size: 2.2rem;
        }

        .form-label {
            color: #355b3b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border: 2px solid #cdddc2;
            border-radius: 15px;
            padding: 12px 15px;
            background: #fbfdf7;
            color: #29412b;
            box-shadow: 0 4px 0 #e0e8d9;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #7ea267;
            box-shadow: 0 0 0 0.2rem rgba(126, 162, 103, 0.2);
        }

        .form-control::placeholder {
            color: #9ba99a;
        }

        .btn-generate {
            background: #4f7d52;
            border: none;
            border-radius: 16px;
            padding: 12px 28px;
            font-weight: 700;
            box-shadow: 0 5px 0 #315c38;
            transition: 0.15s ease;
        }

        .btn-generate:hover {
            background: #416d45;
            transform: translateY(-2px);
        }

        .btn-generate:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #315c38;
        }

        #sku_output {
            min-height: 10px;
        }

        .result-box {
            background: #edf5e7;
            border: 2px dashed #8aaa73;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .result-box::before {
            content: "✓";
            position: absolute;
            top: -14px;
            left: 20px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #4f7d52;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .sku-code {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #294d35;
        }

        @media (max-width: 576px) {
            .app-card {
                padding: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .sku-code {
                font-size: 1.5rem;
            }

            .btn-generate {
                width: 100%;
            }
        }

        py-terminal {
            display: none;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-box-open me-2"></i>
                SKU Generator
            </a>

        </div>

    </nav>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="app-card">

                    <div class="text-center mb-4">

                        <div class="header-icon">
                            <i class="fa-solid fa-barcode"></i>
                        </div>

                        <h1 class="fw-bold">
                            SKU Generator
                        </h1>

                        <p class="text-muted">
                            Create a simple SKU for your product.
                        </p>

                    </div>

                    <div class="mb-3">

                        <label for="category" class="form-label">
                            <i class="fa-solid fa-layer-group me-1"></i>
                            Product Category
                        </label>

                        <select id="category" class="form-select">

                            <option value="Beverages">
                                Beverages
                            </option>

                            <option value="Snacks">
                                Snacks
                            </option>

                            <option value="Electronics">
                                Electronics
                            </option>

                            <option value="Clothing">
                                Clothing
                            </option>

                            <option value="School Supplies">
                                School Supplies
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label for="product_name" class="form-label">
                            <i class="fa-solid fa-tag me-1"></i>
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="product_name"
                            class="form-control"
                            placeholder="Enter product name"
                        >

                    </div>

                    <div class="mb-4">

                        <label for="quantity" class="form-label">
                            <i class="fa-solid fa-cubes me-1"></i>
                            Stock Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            class="form-control"
                            placeholder="Enter stock quantity"
                            min="1"
                        >

                    </div>

                    <div class="text-center">

                        <button
                            type="button"
                            class="btn btn-generate btn-lg text-white"
                        >
                            <i class="fa-solid fa-barcode me-1"></i>
                            Generate SKU
                        </button>

                    </div>

                    <div id="sku_output" class="mt-4"></div>

                </div>

            </div>

        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>

</html>
```

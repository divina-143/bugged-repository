<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test - Sylvia Barinaga and Aivind Belen</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

   <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap');

    html, body {
        height: 100%;
    }

    body {
        min-height: 100vh;
        margin: 0;
        font-family: 'DM Sans', sans-serif;
        color: #304536;

        background:
            radial-gradient(circle at 10% 15%, rgba(255,255,255,0.55) 0 3px, transparent 4px),
            radial-gradient(circle at 85% 25%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
            radial-gradient(circle at 20% 80%, rgba(255,255,255,0.35) 0 5px, transparent 6px),
            linear-gradient(135deg, #b9dcae 0%, #dcefc9 45%, #f5e9c9 100%);

        background-attachment: fixed;

        display: flex;
        flex-direction: column;
    }



    .navbar {
        background: #254d35 !important;
        padding: 0.8rem 0;
        box-shadow: 0 5px 20px rgba(35, 72, 48, 0.2);
    }

    .navbar-brand {
        font-family: 'Pacifico', cursive;
        font-size: 1.45rem;
        color: #f8f2d8 !important;
    }

    .navbar-brand::before {
        content: "🍵 ";
        font-family: sans-serif;
    }

    .nav-link {
        color: #eaf4df !important;
        font-weight: 600;
        border-radius: 2rem;
        padding: 0.5rem 1rem !important;
        margin-left: 0.3rem;
        transition: 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
        background: #d8e9bd;
        color: #315b3e !important;
        transform: rotate(-1deg);
    }

   

    .app-card {
        position: relative;
        border: 3px solid #fffdf3;
        border-radius: 2rem;
        overflow: hidden;

        background: #fffdf5;

        box-shadow:
            0 18px 40px rgba(56, 91, 56, 0.22),
            0 5px 12px rgba(56, 91, 56, 0.1);

        transform: rotate(-0.3deg);
        transition: 0.25s ease;
    }

    .app-card:hover {
        transform: rotate(0deg) translateY(-4px);
        box-shadow:
            0 25px 50px rgba(56, 91, 56, 0.25),
            0 7px 15px rgba(56, 91, 56, 0.12);
    }

  

    .app-card::before {
        content: "✦";
        position: absolute;
        top: 15px;
        right: 22px;
        font-size: 2rem;
        color: #dcebb8;
        transform: rotate(15deg);
        z-index: 5;
    }

    .app-card::after {
        content: "☘";
        position: absolute;
        bottom: 10px;
        left: 15px;
        font-size: 2rem;
        color: #c9dfbd;
        transform: rotate(-15deg);
        z-index: 5;
        pointer-events: none;
    }

   

    .app-card .card-header {
        position: relative;
        border: none;
        padding: 2.2rem 1.5rem;

        background:
            radial-gradient(circle at 80% 20%, rgba(255,255,255,0.2) 0 20px, transparent 21px),
            linear-gradient(135deg, #315e3e, #4f8b58);

        color: white;
    }

    .app-card .card-header::before {
        content: "♡";
        position: absolute;
        left: 25px;
        bottom: 15px;
        font-size: 2rem;
        color: rgba(255,255,255,0.2);
        transform: rotate(-15deg);
    }

    .app-card .card-header i {
        color: #fff4bd;
        filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
    }

    .app-card .card-header h3 {
        font-family: 'Pacifico', cursive;
        font-weight: 400;
        font-size: 1.8rem;
        margin-top: 0.3rem;
        text-shadow: 0 2px 3px rgba(0,0,0,0.12);
    }

    .app-card .card-header small {
        color: #eef6df !important;
        font-weight: 500;
    }

   

    .card-body {
        background: #fffdf5;
        padding: 1.7rem !important;
    }

    .card-body h5 {
        font-weight: 700;
        color: #365b3d;
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .card-body h5::after {
        content: " ✿";
        color: #d09b55;
        font-size: 1.2rem;
    }

   

    .menu-item {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 1rem 1.1rem;
        margin-bottom: 0.8rem;

        background: #ffffff;

        border: 2px solid #e4edd7;
        border-radius: 1rem;

        box-shadow: 0 3px 0 #dce7d1;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    .menu-item:hover {
        background: #f8fbe9;
        border-color: #bdd49d;

        transform: translateX(5px) rotate(0.5deg);

        box-shadow:
            0 5px 0 #cbdcbb,
            0 8px 15px rgba(62, 102, 65, 0.1);
    }

    .menu-item:nth-child(odd) {
        transform: rotate(-0.4deg);
    }

    .menu-item:nth-child(even) {
        transform: rotate(0.4deg);
    }

    .menu-item:nth-child(odd):hover {
        transform: translateX(5px) rotate(-0.2deg);
    }

    .menu-item:nth-child(even):hover {
        transform: translateX(5px) rotate(0.8deg);
    }

    .menu-item > div {
        display: flex;
        align-items: center;
    }

    .menu-item label {
        font-weight: 600;
        color: #38533f;
        margin-left: 0.7rem;
        cursor: pointer;
    }

    /* =========================
       CHECKBOX
    ========================= */

    .form-check-input {
        width: 1.3em;
        height: 1.3em;

        border: 2px solid #a7c292;
        cursor: pointer;

        box-shadow: none !important;
    }

    .form-check-input:checked {
        background-color: #5c9862;
        border-color: #5c9862;
    }

    .form-check-input:focus {
        border-color: #5c9862;
        box-shadow: 0 0 0 0.2rem rgba(92, 152, 98, 0.15) !important;
    }

    /* =========================
       PRICE TAG
    ========================= */

    .menu-item .price {
        color: #476d3d;
        font-weight: 800;

        background: #edf4d9;

        border: 1px dashed #b4c98f;
        border-radius: 2rem;

        padding: 0.35rem 0.75rem;

        transform: rotate(-2deg);
    }

    /* =========================
       ORDER BUTTON
    ========================= */

    .btn-order {
        position: relative;

        background: #4f8b58;
        border: none;
        border-radius: 1rem;

        font-weight: 700;
        letter-spacing: 0.3px;

        padding: 0.9rem;

        box-shadow: 0 5px 0 #35633d;

        transition: 0.15s ease;
    }

    .btn-order::after {
        content: " ✦";
        color: #fff2b8;
    }

    .btn-order:hover {
        background: #3f7549;
        color: white;

        transform: translateY(-2px);

        box-shadow: 0 7px 0 #2c5634;
    }

    .btn-order:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #2c5634;
    }

    
    hr {
        border: none;
        border-top: 2px dashed #d8dfc8;
        opacity: 1;
    }

    #show {
        min-height: 3rem;
    }

    .result-box {
        background: #f3f8e8;

        border: 2px solid #d7e5c4;
        border-left: 6px solid #6b9e61;

        border-radius: 1rem;

        padding: 1rem 1.25rem;

        box-shadow: 0 4px 12px rgba(65, 100, 65, 0.08);
    }

    .receipt-total {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 1.3rem;
        color: #3f7548;
    }



    .card-footer {
        background: #f4f6e9;
        border-top: 2px dashed #d7dfc9;
        color: #71806f !important;
    }

    footer {
        background: #254d35 !important;
        box-shadow: 0 -5px 20px rgba(35, 72, 48, 0.15);
    }

    footer p {
        margin: 0;
        color: #eaf3dc;
        font-size: 0.9rem;
    }


    @media (max-width: 576px) {

        .app-card {
            border-radius: 1.4rem;
            transform: none;
        }

        .app-card:hover {
            transform: none;
        }

        .app-card .card-header {
            padding: 1.7rem 1rem;
        }

        .app-card .card-header h3 {
            font-size: 1.5rem;
        }

        .menu-item {
            padding: 0.85rem;
        }

        .menu-item label {
            font-size: 0.92rem;
        }

        .menu-item .price {
            font-size: 0.9rem;
            padding: 0.3rem 0.6rem;
        }
    }

    py-terminal {
        display: none;
    }
</style>
</head>
<body>

    <div class="container py-5 flex-grow-1">

                            <div class="d-grid mt-4">

                        <hr class="my-4">

                        <div id="show">

                    </div>

                    <div class="card-footer text-center text-muted small py-3">
                        Select your items and click "Create Order"
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center text-light py-4" style="background-color: #0b2545;">
        <div class="container">
            <p class="mb-1">
                <i class="fa-solid fa-code me-1"></i>

            </p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
